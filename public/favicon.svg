<!--
  PLACEHOLDER MARK — not an approved brand asset.

  opencitadel/citadel-design holds the selected "Rampart C" concept and states
  that the generated artwork must not be traced or presented as production
  vectors without design review. This is therefore a deliberately plain
  geometric stand-in that follows the family grammar — navy shell, three-part
  crown, open right side, protected interior, one accent facet — without
  imitating the concept artwork.

  Replace this once citadel-design productionizes the real vector.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Open Citadel">
  <rect width="32" height="32" rx="6" fill="#062A63"/>
  <!-- Three-part crown -->
  <rect x="9" y="5" width="3" height="3" fill="#F7F4EE"/>
  <rect x="14.5" y="5" width="3" height="3" fill="#F7F4EE"/>
  <rect x="20" y="5" width="3" height="3" fill="#F7F4EE"/>
  <!-- Rampart C: open on the right, protecting the interior -->
  <path d="M23 9.5H9v13h14"
        fill="none" stroke="#F7F4EE" stroke-width="3.2" stroke-linecap="square"/>
  <!-- Project token facet -->
  <rect x="16" y="14" width="4" height="4" fill="#00A9F4"/>
</svg>
